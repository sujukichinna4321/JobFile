name: Filter Sultan Salahuddin Ayyubi Series

on:
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন একবার চালানোর জন্য (ঐচ্ছিক)

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download and Filter M3U
        run: |
          python << 'EOF'
          import re
          import requests

          SOURCE_URL = "https://raw.githubusercontent.com/srhady/join_telegram_chennal-livesportsplay/refs/heads/main/latest_movies.m3u"
          OUTPUT_FILE = "sultan_salahuddin_ayyubi.m3u"
          TARGET_NAME = "Sultan Salahuddin Ayyubi"

          def parse_m3u(content):
              lines = content.strip().split('\n')
              entries = []
              current_extinf = None

              for line in lines:
                  line = line.strip()
                  if line.startswith('#EXTINF'):
                      current_extinf = line
                  elif line and not line.startswith('#') and current_extinf:
                      entries.append({
                          'extinf': current_extinf,
                          'url': line
                      })
                      current_extinf = None
              return entries

          def extract_season_episode(name):
              match = re.search(r'S(\d+)\s*E(\d+)', name, re.IGNORECASE)
              if match:
                  return int(match.group(1)), int(match.group(2))
              return None, None

          def main():
              print(f"Downloading from {SOURCE_URL}...")
              try:
                  response = requests.get(SOURCE_URL, timeout=60)
                  response.raise_for_status()
              except Exception as e:
                  print(f"Error downloading: {e}")
                  with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n")
                  return

              content = response.text
              entries = parse_m3u(content)
              print(f"Total entries found: {len(entries)}")

              filtered = []
              seen_urls = set()  # ডুপ্লিকেট চেক করার জন্য সেট

              for entry in entries:
                  name_match = re.search(r',(.+)$', entry['extinf'])
                  if not name_match:
                      continue
                  channel_name = name_match.group(1).strip()

                  if TARGET_NAME.lower() in channel_name.lower():
                      season, episode = extract_season_episode(channel_name)
                      if season is not None and episode is not None:
                          # ইউআরএল আগে থেকে থাকলে স্কিপ করবে
                          if entry['url'] in seen_urls:
                              print(f"Skipping duplicate URL: {channel_name}")
                              continue
                          
                          seen_urls.add(entry['url'])  # নতুন ইউআরএল সেটে যোগ করলাম
                          
                          filtered.append({
                              'entry': entry,
                              'name': channel_name,
                              'season': season,
                              'episode': episode
                          })
                      else:
                          print(f"Skipping (no SxxExx): {channel_name}")

              print(f"Matched unique entries with SxxExx: {len(filtered)}")

              # সিজন এবং এপিসোড অনুযায়ী সাজানো
              filtered.sort(key=lambda x: (x['season'], x['episode']))

              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n")
                  for item in filtered:
                      f.write(item['entry']['extinf'] + "\n")
                      f.write(item['entry']['url'] + "\n")

              print(f"Wrote {len(filtered)} entries to {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sultan_salahuddin_ayyubi.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Sultan Salahuddin Ayyubi playlist (No Duplicates)"
            git pull --rebase origin main
            git push
          fi
