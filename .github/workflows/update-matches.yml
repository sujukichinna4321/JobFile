name: Update Match Notifications (BD Time)

on:
  schedule:
    - cron: '5 18 * * *'   # BD 00:05
    - cron: '5 6  * * *'   # BD 12:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz

      - name: Generate notifications.json
        env:
          DEFAULT_IMAGE: "https://raw.githubusercontent.com/samnite2290/img/gh-pages/HOME/HOME-LIVE-EVENT.png"
          SUBTITLE_SUFFIX: " | Select 🅻🅸🆅🅴 🆂🅿🅾🆁🆃🆂 Button, Share Our Apps With Your Friends & Family."
        run: python generate_matches.py

      - name: Commit and push notifications.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add notifications.json
          git commit -m "Auto-update notifications.json ($(TZ=Asia/Dhaka date +'%d-%m-%Y %H:%M'))" || echo "No changes"
          git push
