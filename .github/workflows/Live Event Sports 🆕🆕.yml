name: Live Event Sports 🆕🆕
on:
  schedule:
    - cron: '*/7 * * * *' 
  workflow_dispatch: 

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update Script
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          DEST_REPO_URL: ${{ secrets.DEST_REPO_URL }}
          DEST_CLONE_DIR: ${{ secrets.DEST_CLONE_DIR }}
          DEST_OUTPUT_FILE: ${{ secrets.DEST_OUTPUT_FILE }}
          DEST_FOOTBALL_FILE: ${{ secrets.DEST_FOOTBALL_FILE }}
          DEST_CRICKET_FILE: ${{ secrets.DEST_CRICKET_FILE }}
          
          # New Group Secrets Added Here
          GROUP_FOOTBALL: ${{ secrets.GROUP_FOOTBALL }}
          GROUP_CRICKET: ${{ secrets.GROUP_CRICKET }}
          GROUP_NFL: ${{ secrets.GROUP_NFL }}
          GROUP_BASE_NAME: ${{ secrets.GROUP_BASE_NAME }}

          SOURCE_TAMPAD: ${{ secrets.SOURCE_TAMPAD }}
          SOURCE_BINGSTREAM: ${{ secrets.SOURCE_BINGSTREAM }}
          SOURCE_SONYLIV: ${{ secrets.SOURCE_SONYLIV }}
          SOURCE_AX: ${{ secrets.SOURCE_AX }}
          SOURCE_WILLOW: ${{ secrets.SOURCE_WILLOW }}
          SOURCE_FANCODEBD_LIVE_EVENT_SPORTS: ${{ secrets.SOURCE_FANCODEBD_LIVE_EVENT_SPORTS }}
          SOURCE_PRIME: ${{ secrets.SOURCE_PRIME }}
          SOURCE_LIVE_EVENT_KSA: ${{ secrets.SOURCE_LIVE_EVENT_KSA }}
          LOCAL_SOURCE_URL: ${{ secrets.LOCAL_SOURCE_URL }}
        run: |
          cat << 'EOF' > update_playlist.py
          import os
          import re
          import requests
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          # Configurations (Fetched from environment variables)
          SOURCE_PLAYLISTS = [
              {"url": os.getenv("SOURCE_SONYLIV", "")},
              {"url": os.getenv("SOURCE_TAMPAD", "")},
              {"url": os.getenv("SOURCE_BINGSTREAM", "")},
              {"url": os.getenv("SOURCE_AX", "")},
              {"url": os.getenv("SOURCE_WILLOW", "")},
              {"url": os.getenv("SOURCE_FANCODEBD_LIVE_EVENT_SPORTS", "")},
              {"url": os.getenv("SOURCE_PRIME", "")},
              {"url": os.getenv("SOURCE_LIVE_EVENT_KSA", "")},
          ]
          SOURCE_PLAYLISTS = [sp for sp in SOURCE_PLAYLISTS if sp["url"]]

          LOCAL_SOURCE_URL = os.getenv("LOCAL_SOURCE_URL", "")

          # Destination secrets
          pat_token   = os.getenv("PAT_TOKEN")
          dest_repo   = os.getenv("DEST_REPO_URL")
          clone_dir   = os.getenv("DEST_CLONE_DIR")
          out_file    = os.getenv("DEST_OUTPUT_FILE")
          fb_file     = os.getenv("DEST_FOOTBALL_FILE")
          ck_file     = os.getenv("DEST_CRICKET_FILE")

          # Group names fetched from secrets to hide branding
          FOOTBALL_GROUP = os.getenv("GROUP_FOOTBALL", "SAWARID سواريد - Football")
          CRICKET_GROUP  = os.getenv("GROUP_CRICKET", "SAWARID سواريد - Cricket")
          NFL_GROUP      = os.getenv("GROUP_NFL", "SAWARID سواريد - NFL")
          BASE_GROUP     = os.getenv("GROUP_BASE_NAME", "SAWARID سواريد")

          SKIP_NAME_KEYWORDS = ["stream tv", "(use vpn)"]

          def parse_blocks(content):
              blocks = []
              lines = content.split('\n')
              current_block = []
              for line in lines:
                  if line.strip().startswith('#EXTINF:'):
                      if current_block:
                          blocks.append(current_block)
                      current_block = [line]
                  elif current_block:
                      current_block.append(line)
              if current_block:
                  blocks.append(current_block)
              return blocks

          def get_block_info(block):
              extinf_line = block[0]
              group = ""
              group_match = re.search(r'group-title="([^"]+)"', extinf_line)
              if group_match:
                  group = group_match.group(1)
              
              name = ""
              comma_idx = extinf_line.rfind(',')
              if comma_idx != -1:
                  name = extinf_line[comma_idx+1:].strip()
              
              urls = []
              for line in block[1:]:
                  line_strip = line.strip()
                  if not line_strip:
                      continue
                  if line_strip.startswith('http://') or line_strip.startswith('https://'):
                      urls.append(line_strip)
              return {'extinf': extinf_line, 'group': group, 'name': name, 'urls': urls}

          def should_skip_name(name):
              n_lower = name.lower()
              for kw in SKIP_NAME_KEYWORDS:
                  if kw in n_lower:
                      return True
              return False

          def replace_vs_in_name(name):
              return re.sub(r'(?<!\S)[vV][sS](?!\S)', '🆚', name)

          def update_extinf_name(extinf, new_name):
              comma_idx = extinf.rfind(',')
              if comma_idx != -1:
                  return extinf[:comma_idx+1] + ' ' + new_name
              return extinf

          def get_normalized_group(original_group):
              og_clean = original_group.strip()
              if not og_clean:
                  return f"{BASE_GROUP} - Sports"
              
              og_lower = og_clean.lower()
              if "football" in og_lower:
                  return FOOTBALL_GROUP
              elif "cricket" in og_lower:
                  return CRICKET_GROUP
              
              parts = og_clean.split()
              capitalized_group = " ".join([p.capitalize() for p in parts])
              return f"{BASE_GROUP} - {capitalized_group}"

          def group_sort_key(group_name):
              g_lower = group_name.lower()
              if "football" in g_lower:
                  return (0, group_name)
              elif "cricket" in g_lower:
                  return (1, group_name)
              else:
                  return (2, group_name)

          def apply_group_to_extinf(extinf, new_group):
              if 'group-title="' in extinf:
                  return re.sub(r'group-title="[^"]*"', f'group-title="{new_group}"', extinf)
              else:
                  comma_idx = extinf.rfind(',')
                  if comma_idx != -1:
                      return extinf[:comma_idx] + f' group-title="{new_group}"' + extinf[comma_idx:]
                  return extinf

          def process_block(block, is_source):
              info = get_block_info(block)
              
              if not info['urls']:
                  return None

              if is_source and should_skip_name(info['name']):
                  return None

              new_group = get_normalized_group(info['group'])
              
              if re.search(r'\bnfl\b', info['name'], re.IGNORECASE):
                  new_group = NFL_GROUP

              extinf = apply_group_to_extinf(info['extinf'], new_group)

              updated_name = replace_vs_in_name(info['name'])
              if updated_name != info['name']:
                  extinf = update_extinf_name(extinf, updated_name)

              return {'group': new_group, 'lines': [extinf] + block[1:]}

          # Setup local and destination repository
          os.system(f"git clone https://x-access-token:{pat_token}@github.com/{dest_repo}.git {clone_dir}")

          # 1. Parse LOCAL playlist
          try:
              r = requests.get(LOCAL_SOURCE_URL, timeout=15)
              local_content = r.text
          except Exception as e:
              print(f"Error loading local source playlist: {e}")
              exit(1)

          header_lines = []
          for line in local_content.split('\n'):
              if line.strip().startswith('#EXTINF:'):
                  break
              header_lines.append(line)
          
          while header_lines and not header_lines[-1].strip():
              header_lines.pop()

          current_len = len(header_lines)
          if current_len < 49:
              padding_needed = 49 - current_len
              for _ in range(padding_needed):
                  header_lines.append("#")
          else:
              header_lines = header_lines[:49]
          header_text = "\n".join(header_lines)

          local_blocks = parse_blocks(local_content)
          grouped_data = defaultdict(list)

          for b in local_blocks:
              processed = process_block(b, is_source=False)
              if processed:
                  grouped_data[processed['group']].extend([processed['lines']])

          print(f"Local blocks processed into {len(grouped_data)} groups")

          # 2. Parse all SOURCE playlists
          for sp in SOURCE_PLAYLISTS:
              try:
                  r = requests.get(sp['url'], timeout=15)
                  if r.status_code == 200:
                      blocks = parse_blocks(r.text)
                      for b in blocks:
                          processed = process_block(b, is_source=True)
                          if processed:
                              grouped_data[processed['group']].extend([processed['lines']])
              except Exception as e:
                  print(f"Error loading source playlist {sp['url']}: {e}")

          sorted_groups = sorted(grouped_data.keys(), key=group_sort_key)

          content_parts = []
          for g_name in sorted_groups:
              g_content = []
              g_content.append("# 🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴")
              g_content.append(f"# 🟢🟢🟢🟢🟢🟢 {g_name} 🟢🟢🟢🟢🟢🟢")
              
              block_strings = []
              for b in grouped_data[g_name]:
                  block_strings.append("\n".join([line for line in b if line.strip()]))
              g_content.append("\n\n\n".join(block_strings))
              
              g_content.append(f"# 🆕 {g_name} 👉 Updateded Done ✅✅✅✅✅✅")
              content_parts.append("\n\n\n".join(g_content))

          rest_of_content = "\n\n\n".join(content_parts)
          final_text = header_text + "\n" + rest_of_content

          # Write main output file using secret name
          output_path = f"{clone_dir}/{out_file}"
          with open(output_path, "w", encoding="utf-8") as f:
              f.write(final_text)

          # 5. Build Football-Live.m3u and Cricket-Live.m3u
          def build_group_playlist(group_name, file_path):
              parts = [header_text, ""]
              if group_name in grouped_data:
                  g_content = []
                  g_content.append("# 🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴")
                  g_content.append(f"# 🟢🟢🟢🟢🟢🟢 {group_name} 🟢🟢🟢🟢🟢🟢")
                  block_strings = []
                  for b in grouped_data[group_name]:
                      block_strings.append("\n".join([line for line in b if line.strip()]))
                  g_content.append("\n\n\n".join(block_strings))
                  g_content.append(f"# 🆕 {group_name} 👉 Updateded Done ✅✅✅✅✅✅")
                  parts.append("\n\n\n".join(g_content))
              with open(file_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(parts))

          build_group_playlist(FOOTBALL_GROUP, f"{clone_dir}/{fb_file}")
          build_group_playlist(CRICKET_GROUP,  f"{clone_dir}/{ck_file}")
          EOF
          python update_playlist.py

      - name: Commit and Push Changes
        env:
          DEST_CLONE_DIR: ${{ secrets.DEST_CLONE_DIR }}
          DEST_OUTPUT_FILE: ${{ secrets.DEST_OUTPUT_FILE }}
          DEST_FOOTBALL_FILE: ${{ secrets.DEST_FOOTBALL_FILE }}
          DEST_CRICKET_FILE: ${{ secrets.DEST_CRICKET_FILE }}
          DEST_BRANCH: ${{ secrets.DEST_BRANCH }}
        run: |
          cd "$DEST_CLONE_DIR"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes found. Commit skipped."
          else
            CURRENT_TIME=$(date -u -d "+6 hours" +"%Y-%m-%d %H:%M:%S")
            
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              COMMIT_MESSAGE="🆗 Live Event Sports : 🆕 Start Done ✅ - $CURRENT_TIME 🟡"
            else
              COMMIT_MESSAGE="🆗 Live Event Sports : 🔄 Updated Done ✅ - $CURRENT_TIME 🟡"
            fi
            
            git add "$DEST_OUTPUT_FILE" "$DEST_FOOTBALL_FILE" "$DEST_CRICKET_FILE"
            git commit -m "$COMMIT_MESSAGE"
            git push origin "$DEST_BRANCH"
          fi
