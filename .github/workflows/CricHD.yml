name: CricHD

on:
  schedule:
    - cron: '*/5 * * * *'  # يتم التشغيل كل 5 دقائق
  workflow_dispatch:  # خيار التشغيل اليدوي

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Generate Updated Playlist
        run: |
          python << 'PYEOF'
          import requests
          import re
          import os

          # الحصول على رابط الصفحة وروابط المصادر المتعددة
          page_url = os.environ.get('CRICHD_PAGE_URL')
          
          # جمع جميع روابط المصادر من المتغيرات البيئية
          raw_sources = [
              os.environ.get('CRICHD_SOURCE_1'),
              os.environ.get('CRICHD_SOURCE_2'),
              os.environ.get('CRICHD_SOURCE_3')  # دعم للرمز القديم CRICHD إذا كان موجوداً
          ]
          
          # تصفية الروابط الفارغة أو غير الموجودة
          source_urls = [url.strip() for url in raw_sources if url and url.strip()]

          if not page_url:
              print("❌ Secret CRICHD_PAGE_URL not found!")
              exit(1)

          if not source_urls:
              print("❌ No valid Source URLs found in secrets!")
              exit(1)

          print(f"📥 Page playlist: {page_url}")
          print(f"🔗 Total Source URLs configured: {len(source_urls)}")

          # تحميل صفحة CRICHD_PAGE
          try:
              page_resp = requests.get(page_url, timeout=30)
              page_resp.raise_for_status()
              page_lines = page_resp.text.strip().split('\n')
              print(f"✅ Page playlist downloaded: {len(page_lines)} lines")
          except Exception as e:
              print(f"❌ Failed to download page playlist: {e}")
              exit(1)

          # أسماء القنوات المستهدفة للمطابقة
          target_channels = [
              "Sky Sports Cricket", "Sky Sports Football", "Sky Sports Golf", "Sky Sports Action",
              "Sky Sports Main Event", "Sky Sports News", "Sky Sports Tennis", "Sky Sports Mix",
              "Sky Sports Premier League", "Sky Sports F1", "TNT Sports 3", "TNT Sports 4",
              "TNT Sports 1", "Viaplay Sports 1 UK", "TNT Sports 2", "PTV Sports",
              "Viaplay Sports 2 UK", "LaLiga TV UK", "Star Sports 1", "Willow Cricket",
              "A Sports HD", "Ten Sports", "Willow Cricket Extra", "ESPN US", "Sky Sport 1 NZ",
              "ESPN 2 US", "Star Sports 1 Hindi", "Sky Sport 3 NZ", "Sky Sport 2 NZ",
              "Sky Sport 4 NZ", "Sky Sport 7 NZ", "Sky Sport 5 NZ", "Sky Sport 6 NZ",
              "Sky Sport 9 NZ", "Fox Deportes", "Sky Sport 8 NZ", "BeIn Sports USA",
              "Fox Sports 2 US", "Movistar #Vamos", "TUDN USA", "BeIn Sports HD 1 France",
              "Fox Sports 1 US", "Telemundo", "Movistar Deportes", "NBC", "DAZN 1 Spain",
              "DAZN 2 Spain", "DAZN 3 Spain", "BBC One", "DAZN 4 Spain", "LaLiga TV Hypermotion",
              "ITV 1", "BBC Two", "ITV4", "LaLiga TV Hypermotion 2", "Fox Soccer Plus",
              "Disney+ SP", "ESPN Deportes",
              "Star Sports 1", "Star Sports 1 Hindi", "PTV Sports", "Willow HD",
              "Willow HD 2", "Ten Sports", "A Sports HD", "Sky Sports Cricket",
              "Sky Sports Main Event", "TNT 1", "TNT 2", "TNT 3",
              "TNT 4", "Sky Sport Nz 1", "Sky Sport Nz 2", "Sky Sport Nz 3",
              "Sky Sport Nz 4", "Sky Sport Nz 5", "Sky Sport 6 Nz", "Sky Sport Nz 7",
              "Sky Sport Nz 8", "Sky Sport Nz 9", "Sky Cinema", "Sky Sports Action",
              "Sky Sports Golf", "Sky Sports Premier League", "Sky Sports Football", "Sky Sports Plus",
              "Sky Sports F1", "LaLiGA", "Premier Sports 1", "Premier Sports 2",
              "Super Football", "Super Premier League", "Astro Cricket", "ESPN 1",
              "ESPN 2", "Sky Sports Arena", "Sky Sports Mix", "Sky Sports Tennis",
              "Fox Cricket 501 HD", "Sony Sports3"
          ]

          # دالة مساعدة للحصول على اسم القناة من سطر EXTINF
          def get_channel_name(line):
              if line.startswith('#EXTINF:'):
                  parts = line.split(',')
                  if len(parts) > 1:
                      return parts[-1].strip()
              return None

          source_blocks = {}

          # التكرار عبر كل سورس متوفر بالتتابع (Multi-source Backup system)
          for idx, src_url in enumerate(source_urls, 1):
              print(f"\n🔄 Trying Source #{idx}: {src_url}")
              try:
                  source_resp = requests.get(src_url, timeout=30)
                  source_resp.raise_for_status()
                  source_lines = source_resp.text.strip().split('\n')
                  
                  if not source_lines or len(source_lines) < 2:
                      print(f"⚠️ Source #{idx} returned empty playlist. Skipping...")
                      continue

                  print(f"✅ Source #{idx} downloaded successfully ({len(source_lines)} lines)")

                  # استخراج القنوات من هذا المصدر
                  i = 0
                  added_count = 0
                  while i < len(source_lines):
                      line = source_lines[i].strip()
                      if line.startswith('#EXTINF:'):
                          ch_name = get_channel_name(line)
                          if ch_name and ch_name in target_channels:
                              # إضافة القناة فقط إذا لم يتم العثور عليها من مصادر سابقة
                              if ch_name not in source_blocks:
                                  block_lines = [line]
                                  i += 1
                                  while i < len(source_lines):
                                      next_line = source_lines[i].strip()
                                      if next_line.startswith('#EXTINF:'):
                                          break
                                      if next_line:
                                          block_lines.append(next_line)
                                      i += 1
                                  source_blocks[ch_name] = '\n'.join(block_lines)
                                  added_count += 1
                                  continue
                      i += 1
                  print(f"➕ Found {added_count} new channel(s) from Source #{idx}")

              except Exception as e:
                  print(f"⚠️ Source #{idx} failed or broken link! Error: {e}")
                  continue

          print(f"\n🔍 Total unique matching channels gathered from all active sources: {len(source_blocks)}")

          # معالجة سطور EXTINF من قائمة تشغيل الصفحة لتوليد قائمة التشغيل النهائية
          final_lines = []
          i = 0
          while i < len(page_lines):
              line = page_lines[i].strip()
              if line.startswith('#EXTINF:'):
                  ch_name = get_channel_name(line)
                  if ch_name and ch_name in source_blocks:
                      final_lines.append(line)
                      final_lines.append(source_blocks[ch_name].split('\n', 1)[1] if '\n' in source_blocks[ch_name] else '')
                      i += 1
                      while i < len(page_lines):
                          next_line = page_lines[i].strip()
                          if next_line.startswith('#EXTINF:'):
                              break
                          i += 1
                      final_lines.append('')
                      final_lines.append('')
                      continue
                  else:
                      final_lines.append(line)
              elif line.startswith('#EXTM3U'):
                  final_lines.append(line)
              i += 1

          if final_lines and not final_lines[0].startswith('#EXTM3U'):
              final_lines.insert(0, '#EXTM3U')

          content = '\n'.join(final_lines)
          
          # حفظ ملف المخرجات
          with open('CRICHD.m3u', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print(f"✅ Generated playlist: {len(content)} characters, {content.count('#EXTINF:')} entries")
          print("📋 First 15 lines of output:")
          for line in content.split('\n')[:15]:
              print(f"  {line}")
          PYEOF
        env:
          CRICHD_PAGE_URL: ${{ secrets.CRICHD_PAGE }}
          CRICHD_SOURCE_1: ${{ secrets.CRICHD1 }}
          CRICHD_SOURCE_2: ${{ secrets.CRICHD2 }}
          CRICHD_SOURCE_3: ${{ secrets.CRICHD3 }}
          CRICHD_SOURCE_OLD: ${{ secrets.CRICHD }}

      - name: Deploy to Pizza Repository
        run: |
          # استنساخ مستودع Pizza
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/buzzinguaecn/Pizza.git pizza-repo
          
          # نسخ الملف المولد
          cp CRICHD.m3u pizza-repo/CRICHD.m3u
          
          cd pizza-repo
          
          # تهيئة إعدادات Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # إرسال التعديلات ودفعها
          git add CRICHD.m3u
          git diff --staged --quiet || git commit -m "🔄 Auto-update CRICHD playlist [skip ci]"
          git push origin main
          
          echo "✅ Successfully pushed to buzzinguaecn/Pizza/main/CRICHD.m3u"
