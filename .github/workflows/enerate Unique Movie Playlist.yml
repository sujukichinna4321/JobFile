name: Generate Unique Movie Playlist

on:
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন একবার চালানোর জন্য (ঐচ্ছিক)

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download and Remove Duplicates
        run: |
          python << 'EOF'
          import re
          import requests

          # সোর্স প্লেলিস্টের লিংক
          SOURCE_URL = "https://raw.githubusercontent.com/srhady/join_telegram_chennal-livesportsplay/refs/heads/main/latest_movies.m3u"
          OUTPUT_FILE = "movie.m3u"

          def parse_m3u(content):
              """M3U কন্টেন্টকে এন্ট্রির লিস্টে ভাগ করে"""
              lines = content.strip().split('\n')
              entries = []
              current_extinf = None

              for line in lines:
                  line = line.strip()
                  if line.startswith('#EXTINF'):
                      current_extinf = line
                  elif line and not line.startswith('#') and current_extinf:
                      entries.append({
                          'extinf': current_extinf,
                          'url': line
                      })
                      current_extinf = None
              return entries

          def main():
              print(f"Downloading from {SOURCE_URL}...")
              try:
                  response = requests.get(SOURCE_URL, timeout=120)
                  response.raise_for_status()
              except Exception as e:
                  print(f"Error downloading: {e}")
                  # এরর হলে খালি ফাইল তৈরি করবে
                  with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n")
                  return

              content = response.text
              entries = parse_m3u(content)
              print(f"Total entries found in source: {len(entries)}")

              unique_entries = []
              seen_urls = set()      # URL চেক করার জন্য
              seen_names = set()     # চ্যানেলের নাম চেক করার জন্য

              for entry in entries:
                  # চ্যানেলের নাম বের করা
                  name_match = re.search(r',(.+)$', entry['extinf'])
                  if not name_match:
                      continue
                  channel_name = name_match.group(1).strip()
                  url = entry['url'].strip()

                  # ডুপ্লিকেট চেক (URL অথবা নাম যেকোনো একটি মিললে স্কিপ করবে)
                  if url in seen_urls or channel_name in seen_names:
                      continue

                  # ইউনিক হলে সেটে যোগ করবে এবং লিস্টে রাখবে
                  seen_urls.add(url)
                  seen_names.add(channel_name)
                  unique_entries.append(entry)

              print(f"Total unique entries found: {len(unique_entries)}")

              # movie.m3u ফাইলে সেভ করা
              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n")
                  for item in unique_entries:
                      f.write(item['extinf'] + "\n")
                      f.write(item['url'] + "\n")

              print(f"Successfully wrote {len(unique_entries)} unique entries to {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add movie.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update movie.m3u (Removed Duplicates)"
            # রিমোটের সাথে সিঙ্ক করে নেওয়া
            git pull --rebase origin main
            git push
          fi
