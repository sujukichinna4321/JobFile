name: Match Trigger Scheduler 🎯

on:
  schedule:
    # প্রতি ৫ মিনিটে চেক করবে — এটাই GitHub-এর সবচেয়ে নির্ভরযোগ্য interval
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Check matches & trigger workflow
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TARGET_WORKFLOW_FILE: "Live Event Sports 🆕.yml"
          JSON_URL: "https://raw.githubusercontent.com/samnite2290/job/gh-pages/notifications.json"
          TRIGGER_MINUTES_BEFORE: "4"
          WINDOW_MINUTES: "5"     # কত মিনিটের মধ্যে ম্যাচ থাকলে trigger দেবে
        run: |
          cat << 'EOF' > trigger_logic.py
          import os, re, json, requests
          from datetime import datetime, timedelta, timezone
          from urllib.parse import quote

          PAT    = os.getenv("PAT_TOKEN")
          OWNER  = os.getenv("REPO_OWNER")
          REPO   = os.getenv("REPO_NAME")
          WFILE  = os.getenv("TARGET_WORKFLOW_FILE")
          URL    = os.getenv("JSON_URL")
          AHEAD  = int(os.getenv("TRIGGER_MINUTES_BEFORE", "4"))
          WINDOW = int(os.getenv("WINDOW_MINUTES", "5"))

          BD_TZ  = timezone(timedelta(hours=6))
          now_bd = datetime.now(BD_TZ).replace(second=0, microsecond=0)

          def parse_json_time(s):
              if not s: return None
              s = s.strip()
              m = re.match(
                  r'^(\d{1,2})-(\d{1,2})-(\d{4})-(\d{1,2}):(\d{2})\s*(\d{2})?\s*(am|pm)?$',
                  s.lower())
              if not m: return None
              d, mo, y, hh, mm, _sec, ampm = m.groups()
              hh = int(hh); mm = int(mm)
              if ampm == 'pm' and hh != 12: hh += 12
              if ampm == 'am' and hh == 12: hh = 0
              try:
                  return datetime(int(y), int(mo), int(d), hh, mm, tzinfo=BD_TZ)
              except Exception:
                  return None

          def extract_all_times(entry):
              times = []
              t1 = parse_json_time(entry.get("Date & Time", ""))
              if t1: times.append(t1)
              mt = entry.get("multipleTime", "") or ""
              for part in re.findall(r'\(([^)]+)\)', mt):
                  t = parse_json_time(part)
                  if t: times.append(t)
              return times

          # JSON fetch
          try:
              r = requests.get(URL, timeout=20)
              r.raise_for_status()
              data = json.loads(r.text)
          except Exception as e:
              print(f"❌ JSON fetch/parse error: {e}")
              raise SystemExit(0)

          # এখন থেকে (৪ + ৫) মিনিট সামনের সব ম্যাচ ধরব
          window_start = now_bd + timedelta(minutes=AHEAD)
          window_end   = now_bd + timedelta(minutes=AHEAD + WINDOW)

          matched = []
          for entry in data:
              for t in extract_all_times(entry):
                  if window_start <= t <= window_end:
                      matched.append((entry.get("Title","?"),
                                      t.strftime("%d-%m-%Y %I:%M %p")))
                      break

          print(f"🕒 Now (BD): {now_bd.strftime('%d-%m-%Y %I:%M %p')}")
          print(f"🎯 Window:  {window_start.strftime('%I:%M %p')} – {window_end.strftime('%I:%M %p')}")
          print(f"✅ Matched: {len(matched)}")
          for title, t in matched:
              print(f"   • {title}  @ {t}")

          if not matched:
              print("⏭️  No match. Exit.")
              raise SystemExit(0)

          # Trigger
          encoded_file = quote(WFILE, safe='')
          api = f"https://api.github.com/repos/{OWNER}/{REPO}/actions/workflows/{encoded_file}/dispatches"
          headers = {
              "Authorization": f"Bearer {PAT}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          resp = requests.post(api, headers=headers,
                               json={"ref": "main"}, timeout=20)
          if resp.status_code in (204, 201, 200):
              print(f"🚀 Triggered {WFILE} ({resp.status_code})")
          else:
              print(f"❌ Trigger failed: {resp.status_code} {resp.text}")
          EOF
          python trigger_logic.py
