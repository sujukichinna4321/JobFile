name: Country Channel 🍀

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  TZ: "Asia/Dhaka"

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: buzzinguaecn/Pizza
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Run playlist update script
        id: update_script
        run: |
          python3 - << 'EOF'
          import os
          import requests
          import re
          from datetime import datetime
          from pathlib import Path

          # ==================== কনফিগারেশন ====================
          UPDATED_SOURCES = {
              "Arabic": ["https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/LiveTV/Arabic/LiveTV.m3u"],
              "Indonesia": ["https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/LiveTV/Indonesia/LiveTV.m3u"],
              "France": ["https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/LiveTV/France/LiveTV.m3u"],
              "India": ["https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/LiveTV/India/LiveTV.m3u"],
              "Afghanistan": ["https://iptv-org.github.io/iptv/countries/af.m3u"],
              "Sports1": ["https://iptv-org.github.io/iptv/categories/sports.m3u"],
              "China": ["https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/LiveTV/China/LiveTV.m3u"],
              "BDIX": [
                  "http://103.229.254.25:7001/playlist.m3u8",
                  "http://103.161.153.165:8000/playlist.m3u8",
                  "http://8.243.126.131:8000/playlist.m3u8",
                  "http://204.199.242.203:58000/playlist.m3u8",
                  "http://38.41.8.1:8000/playlist.m3u8",
                  "http://103.76.111.180:7780/playlist.m3u8",
                  "http://31.149.103.41:8000/playlist.m3u8"
              ]
          }
          # ====================================================

          def download_playlist(url):
              """প্লেলিস্ট ডাউনলোড করে"""
              try:
                  # GitHub র-ফাইলের জন্য সঠিক URL এ কনভার্ট
                  if 'github.com' in url and '/blob/' in url:
                      url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/')
                  
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  }
                  resp = requests.get(url, timeout=30, headers=headers)
                  resp.raise_for_status()
                  return resp.text
              except Exception as e:
                  print(f"ডাউনলোড ব্যর্থ {url}: {e}")
                  return None

          def clean_channel_name(extinf_line):
              """
              শুধুমাত্র (720p), (1080p), [Geo-Blocked], [Geo Blocked] রিমুভ করে
              বাকি সব প্রপার্টি অক্ষুণ্ণ রাখে
              """
              if ',' not in extinf_line:
                  return extinf_line
              
              # EXTINF অংশ এবং নাম অংশ আলাদা
              parts = extinf_line.split(',', 1)
              prefix = parts[0]
              name = parts[1] if len(parts) > 1 else ''
              
              # শুধুমাত্র পিক্সেল এবং জিও ব্লক রিমুভ
              name = re.sub(r'\s*\(\d+p\)\s*', ' ', name, flags=re.IGNORECASE)
              name = re.sub(r'\s*\[\s*geo\s*[- ]?\s*blocked?\s*\]\s*', ' ', name, flags=re.IGNORECASE)
              
              # অতিরিক্ত স্পেস ক্লিন
              name = re.sub(r'\s+', ' ', name).strip()
              
              return f"{prefix},{name}"

          def remove_tvg_id(extinf_line):
              """EXTINF লাইন থেকে tvg-id রিমুভ করে"""
              # tvg-id="xxx" রিমুভ করি
              extinf_line = re.sub(r'tvg-id="[^"]*"\s*', '', extinf_line)
              # একাধিক স্পেস ক্লিন
              extinf_line = re.sub(r'\s+', ' ', extinf_line).strip()
              return extinf_line

          def fix_license_type(content):
              """
              license_type=clearkey না থাকলে clearkey করে দেয়
              """
              lines = content.splitlines()
              new_lines = []
              
              for line in lines:
                  if 'inputstream.adaptive.license_type=' in line:
                      if 'clearkey' not in line.lower():
                          # license_type এর মান clearkey সেট করি
                          line = re.sub(r'inputstream\.adaptive\.license_type=[^,\s]+', 
                                       'inputstream.adaptive.license_type=clearkey', line)
                  new_lines.append(line)
              
              return '\n'.join(new_lines)

          def process_playlist(content, group_title):
              """
              প্লেলিস্ট প্রসেস করে গ্রুপ টাইটেল যোগ/পরিবর্তন করে
              """
              if not content:
                  return None
              
              # license_type ফিক্স করি
              content = fix_license_type(content)
              
              lines = content.splitlines()
              new_lines = []
              i = 0
              
              while i < len(lines):
                  line = lines[i].strip()
                  
                  # EXTINF লাইন প্রসেস
                  if line.startswith('#EXTINF'):
                      # tvg-id রিমুভ করি
                      line = remove_tvg_id(line)
                      
                      # গ্রুপ টাইটেল চেক করি
                      if 'group-title=' in line:
                          # পুরনো গ্রুপ টাইটেল রিপ্লেস করি
                          line = re.sub(r'group-title="[^"]*"', f'group-title="{group_title}"', line)
                      else:
                          # গ্রুপ টাইটেল যোগ করি
                          if 'tvg-logo=' in line:
                              line = re.sub(r'(tvg-logo="[^"]*")', f'\\1 group-title="{group_title}"', line)
                          else:
                              # tvg-logo না থাকলে EXTINF এর পরে যোগ করি
                              if line.startswith('#EXTINF:-1'):
                                  line = line.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{group_title}"', 1)
                              else:
                                  # অন্য ফরম্যাটের জন্য
                                  line = re.sub(r'(#EXTINF[^,]*?)', f'\\1 group-title="{group_title}"', line, 1)
                      
                      # নাম ক্লিন করি (শুধুমাত্র পিক্সেল ও জিও ব্লক)
                      line = clean_channel_name(line)
                      new_lines.append(line)
                      i += 1
                      
                      # KODIPROP, EXTVLCOPT, EXTHTTP সহ সব প্রপার্টি লাইন সংগ্রহ করি
                      while i < len(lines):
                          next_line = lines[i].strip()
                          if next_line.startswith('#') and not next_line.startswith('#EXTINF'):
                              new_lines.append(next_line)
                              i += 1
                          else:
                              break
                      
                      # URL লাইন যোগ করি (যদি থাকে)
                      if i < len(lines):
                          url_line = lines[i].strip()
                          if url_line and not url_line.startswith('#'):
                              new_lines.append(url_line)
                              i += 1
                      
                      # প্রতিটি এন্ট্রির পর ২ লাইন গ্যাপ
                      new_lines.append('')
                      new_lines.append('')
                      
                  else:
                      # #EXTM3U বা অন্য হেডার লাইন
                      if line.startswith('#EXTM3U'):
                          new_lines.append(line)
                      elif line and not line.startswith('#'):
                          # URL লাইন (যদি আগে প্রসেস না করা হয়)
                          if i > 0 and not lines[i-1].strip().startswith('#EXTINF'):
                              new_lines.append(line)
                              new_lines.append('')
                              new_lines.append('')
                      i += 1
              
              return '\n'.join(new_lines)

          def create_playlist(country, urls):
              """
              কান্ট্রির জন্য প্লেলিস্ট তৈরি করে
              """
              print(f"\n🔹 প্রসেসিং {country}...")
              
              all_entries = []
              total_channels = 0
              
              for url in urls:
                  print(f"    ↳ ডাউনলোড: {url}")
                  content = download_playlist(url)
                  if content:
                      processed = process_playlist(content, country)
                      if processed:
                          # চ্যানেল কাউন্ট করি
                          channel_count = len(re.findall(r'#EXTINF', processed))
                          total_channels += channel_count
                          all_entries.append(processed)
                          print(f"    ✓ {channel_count} টি চ্যানেল প্রসেস করা হয়েছে")
                  else:
                      print(f"    ⚠️ {url} ব্যর্থ, এড়িয়ে যাচ্ছি।")
              
              if not all_entries:
                  print(f"⚠️ {country} এর জন্য কোনো বৈধ সোর্স পাওয়া যায়নি")
                  return None
              
              # সব এন্ট্রি মার্জ করি
              merged_content = '\n'.join(all_entries)
              
              # টাইমস্ট্যাম্প তৈরি
              now = datetime.now().strftime("%I:%M:%S%p - %d-%m-%Y")
              
              # প্লেলিস্ট হেডার
              final_lines = [
                  "#EXTM3U",
                  f"# Update Time: {now}",
                  f"# Total Channels: {total_channels}",
                  "# 👉 All links included in this file have been collected from publicly available sources.",
                  "# 👉 If any content owner wishes to have their source removed, please contact us.",
                  "# 👉 Inbox Us:  👈",
                  "",
                  f"# ============ {country} Channels ============",
                  ""
              ]
              
              # কন্টেন্ট যোগ করি
              final_lines.append(merged_content)
              
              return '\n'.join(final_lines)

          # ==================== মূল প্রোগ্রাম ====================
          def main():
              # গিট কনফিগার
              os.system('git config user.name "github-actions[bot]"')
              os.system('git config user.email "github-actions[bot]@users.noreply.github.com"')
              
              # প্রতিটি কান্ট্রি প্রসেস করি
              for country, urls in UPDATED_SOURCES.items():
                  print(f"\n{'='*60}")
                  print(f"📁 প্রসেসিং {country}")
                  print(f"{'='*60}")
                  
                  # প্লেলিস্ট তৈরি করি
                  playlist_content = create_playlist(country, urls)
                  
                  if playlist_content:
                      filename = f"{country}.m3u"
                      
                      # ফাইল সেভ করি
                      with open(filename, "w", encoding="utf-8") as f:
                          f.write(playlist_content)
                      
                      # গিট অপারেশন
                      event_name = os.getenv("GITHUB_EVENT_NAME")
                      if event_name == "workflow_dispatch":
                          commit_msg = f"🆕 {country} : Manual Update ✅"
                      else:
                          commit_msg = f"🔄 {country} : Scheduled Update ✅"
                      
                      os.system(f'git add {filename}')
                      status = os.popen('git status --porcelain').read()
                      
                      if filename in status:
                          os.system(f'git commit -m "{commit_msg}"')
                          print(f"✅ {country} কমিট করা হয়েছে: {commit_msg}")
                      else:
                          print(f"ℹ️ {country} তে কোনো পরিবর্তন নেই")
              
              # সব পুশ করি
              os.system('git push origin main')
              print("\n🎉 সব পরিবর্তন পুশ করা হয়েছে।")

          if __name__ == "__main__":
              main()
          EOF

      - name: 📝 Final push (if any pending)
        run: |
          git push origin main || echo "No changes to push"
